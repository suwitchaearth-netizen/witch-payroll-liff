<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>กำลังเข้าสู่ระบบ...</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg-1: #0a0612;
    --bg-2: #1a0b3a;
    --gold: #d4af37;
    --gold-bright: #f4d676;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --purple-glow: #7c3aed;
    --pink-glow: #e879f9;
    --emerald-glow: #34d399;
    --rose-glow: #fb7185;
    --text-primary: #f5e6ff;
    --text-secondary: #b8a8d4;
    --text-muted: #7a6a94;
    --glass: rgba(124, 58, 237, 0.08);
    --glass-border: rgba(212, 175, 55, 0.25);
  }
  
  html, body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'IBM Plex Sans Thai', 'Bai Jamjuree', sans-serif;
    background: var(--bg-1);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232, 121, 249, 0.25), transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 30%, rgba(124, 58, 237, 0.35), transparent 60%),
      radial-gradient(ellipse 70% 50% at 15% 70%, rgba(212, 175, 55, 0.15), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-1) 100%);
    z-index: -2;
    animation: aurora 20s ease-in-out infinite;
  }
  
  @keyframes aurora {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-2%, 1%) scale(1.05); }
  }
  
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 60px 90px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 130px 50px, rgba(212,175,55,0.5), transparent),
      radial-gradient(1px 1px at 200px 120px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 280px 40px, rgba(232,121,249,0.6), transparent),
      radial-gradient(1.5px 1.5px at 340px 100px, rgba(255,255,255,0.5), transparent);
    background-repeat: repeat;
    background-size: 400px 200px;
    z-index: -1;
    opacity: 0.7;
    animation: twinkle 8s ease-in-out infinite;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }
  
  .card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 40px 32px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.6s ease-out;
  }
  
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  
  /* Loading state */
  .loading-icon-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }
  
  .loading-icon-wrap::before {
    content: '';
    position: absolute;
    inset: -16px;
    background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  
  .loading-icon {
    position: relative;
    font-size: 56px;
    filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
    animation: pulse-glow 1.5s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.3); opacity: 1; }
  }
  
  @keyframes pulse-glow {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .card-title {
    font-family: 'Cinzel', 'Bai Jamjuree', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 50%, #c9a342 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  
  .card-title-error {
    background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .card-title-welcome {
    background: linear-gradient(135deg, var(--pink-glow) 0%, var(--purple-glow) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .card-divider {
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 16px;
  }
  
  .card-text {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    line-height: 1.6;
  }
  
  .card-text-muted {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-top: 12px;
    text-transform: uppercase;
  }
  
  /* Loading dots */
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 4px;
  }
  
  .loading-dots span {
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  
  .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
  .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
  
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  
  /* Error icon */
  .error-icon {
    font-size: 56px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.5));
  }
  
  /* Register hint icon */
  .welcome-icon {
    font-size: 56px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 20px rgba(232, 121, 249, 0.5));
    animation: wave 2s ease-in-out infinite;
  }
  
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(15deg); }
    75% { transform: rotate(-10deg); }
  }
  
  .btn-action {
    margin-top: 20px;
    padding: 14px 28px;
    border: none;
    border-radius: 14px;
    font-family: 'Bai Jamjuree', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--purple-glow) 0%, var(--pink-glow) 100%);
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    transition: transform 0.2s;
  }
  
  .btn-action:active {
    transform: scale(0.96);
  }
  
  .hidden { display: none !important; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- ⏳ Loading -->
<div id="loadingBox" class="card">
  <div class="loading-icon-wrap">
    <div class="loading-icon">🔐</div>
  </div>
  <h1 class="card-title">กำลังเข้าสู่ระบบ</h1>
  <div class="card-divider"></div>
  <p class="card-text">
    <span id="statusText">รอสักครู่</span>
    <span class="loading-dots"><span></span><span></span><span></span></span>
  </p>
</div>

<!-- ⚠️ Error -->
<div id="errorBox" class="card hidden">
  <div class="error-icon">⚠️</div>
  <h1 class="card-title card-title-error">เกิดข้อผิดพลาด</h1>
  <div class="card-divider"></div>
  <p class="card-text" id="errorMsg">-</p>
  <p class="card-text-muted">กรุณาลองใหม่หรือติดต่อ HR</p>
</div>

<!-- 👋 Register hint -->
<div id="registerHint" class="card hidden">
  <div class="welcome-icon">👋</div>
  <h1 class="card-title card-title-welcome">ยังไม่ได้ลงทะเบียน</h1>
  <div class="card-divider"></div>
  <p class="card-text">กรุณาเปิดเมนู<br><strong style="color: var(--gold-bright);">"📸 ลงเวลาเข้างาน"</strong><br>เพื่อลงทะเบียนก่อนใช้งานเมนูอื่น</p>
  <button onclick="openRegisterLiff()" class="btn-action">
    🔓 ไปลงทะเบียน
  </button>
</div>

<script>
const LIFF_ID = '2010080308-vAnB7tAM';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycsbA-O-0GTpjIPAhd-eOMM_MpQ29R11s7FyZxuqtim9-oIoN0CEYSO6UZHajLlOFh/exec';

function getViewParam() {
  const params = new URLSearchParams(window.location.search);
  return params.get('view') || 'main';
}

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function showError(msg) {
  document.getElementById('loadingBox').classList.add('hidden');
  document.getElementById('errorBox').classList.remove('hidden');
  document.getElementById('errorMsg').textContent = msg;
}

function showRegisterHint() {
  document.getElementById('loadingBox').classList.add('hidden');
  document.getElementById('registerHint').classList.remove('hidden');
}

function openRegisterLiff() {
  window.location.href = 'https://liff.line.me/' + LIFF_ID;
}

async function callBackend(payload) {
  const response = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  });
  return await response.json();
}

async function init() {
  try {
    setStatus('เชื่อมต่อ LINE');
    await liff.init({ liffId: LIFF_ID });
    
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    
    setStatus('ตรวจสอบบัญชี');
    const profile = await liff.getProfile();
    const lineUserId = profile.userId;
    
    setStatus('ขอ token');
    const result = await callBackend({
      action: 'liff_get_login_token',
      lineUserId: lineUserId
    });
    
    if (!result.success) {
      if (result.notRegistered) {
        showRegisterHint();
      } else {
        showError(result.error || 'ไม่สามารถสร้าง token ได้');
      }
      return;
    }
    
    setStatus('เปิดระบบ');
    
    const view = getViewParam();
    const targetUrl = APPS_SCRIPT_URL 
      + '?page=attendance'
      + '&liff_token=' + encodeURIComponent(result.token)
      + '&view=' + encodeURIComponent(view);
    
    window.location.replace(targetUrl);
    
  } catch (e) {
    showError(e.message);
  }
}

window.addEventListener('load', init);
</script>

</body>
</html>
